name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture and validate page gallery
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/bidoraq-preview.log 2>&1 &

      - name: Wait for preview server
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bidoraq-preview.log
          exit 1

      - name: Capture screenshots
        run: npm run screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: bidoraq-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
