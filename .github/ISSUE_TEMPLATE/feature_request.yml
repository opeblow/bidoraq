name: Feature request
description: Propose a product, engineering, or documentation improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Describe the problem first, then the proposed change. Feature requests should preserve the local-first evidence model.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Explain the failure mode or gap in the current workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List other approaches and why they were not chosen.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Product model
        - User interface
        - Domain logic
        - Receipts
        - Security
        - Documentation
        - Automation
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Add examples, screenshots, or links that explain the request.
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not introduce seeded or fabricated records.
          required: true
        - label: This does not require a backend without explicit discussion.
          required: false
        - label: This preserves redacted receipt behavior.
          required: false
